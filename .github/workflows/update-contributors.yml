name: Update contributors

on:
  schedule:
    - cron: "0 10 * * 1,3,5"
  workflow_dispatch: ~

jobs:
  update-contributors:
    name: Update contributors
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: pnpm
          cache-dependency-path: pwa/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: pwa
        run: pnpm install --frozen-lockfile

      - name: Fetch contributors
        working-directory: pwa
        env:
          GITHUB_KEY: ${{ secrets.GH_KEY }}
        run: pnpm contributors

      - name: Create pull request
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "feat: update contributors"
          title: "feat: update contributors"
          body: Automated refresh (Mon/Wed/Fri at 10:00 UTC) of the contributors ranking (`pwa/data/contributors.json`). Opened only when the generated data differs from the current one.
          branch: feat/update-contributors
          delete-branch: true
          add-paths: pwa/data/contributors.json
